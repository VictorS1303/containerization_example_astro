services:
  app:
    build: .
    ports:
      - "4321:4321"

    depends_on:
      - db

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: heading_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    networks:
      - heading_app_network

  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: heading_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - heading_postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - heading_app_network

volumes:
  heading_postgres_data:

networks:
  heading_app_network: